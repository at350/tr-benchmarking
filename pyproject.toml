[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "tr-benchmarking"
version = "0.1.0"
description = "Cluster and inspect how language models reason about legal questions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alan Tai" }, { name = "DavidL0417" }, { name = "Clark Hanlon" }]
keywords = ["legal", "llm-evaluation", "clustering", "embeddings", "benchmark", "irac"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3",          # sklearn.cluster.HDBSCAN
    "umap-learn>=0.5",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "sentence-transformers>=2.2", # pulls in PyTorch; see README for the CPU-only install
    "openai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pandas>=2.0", "seaborn>=0.13"]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=8.0"]
all = ["tr-benchmarking[viz,pdf,dev]"]

[project.scripts]
trbench = "trbench.cli:main"

[project.urls]
Repository = "https://github.com/at350/tr-benchmarking"
Issues = "https://github.com/at350/tr-benchmarking/issues"

[tool.setuptools.packages.find]
include = ["trbench", "trbench.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "rubric-automation/tests"]
pythonpath = ["rubric-automation"]
addopts = "-q"
