# Repository-level test configuration so `pytest` works from the root.
# Python 3.10 or newer (CI runs 3.12).
# (The Python code itself is organised as scripts + two folders, not an installable package.)
[tool.pytest.ini_options]
testpaths = ["rubric-automation/tests", "lsh/tests", "lsh-IRAC/tests"]
pythonpath = ["rubric-automation", "lsh-IRAC", "."]
addopts = "-q"
