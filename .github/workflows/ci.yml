name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:dasha-comparison
      - run: npm run build

  python:
    name: Python (compile, rubric-automation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The clustering stack (torch, sentence-transformers) is too heavy for CI;
      # byte-compile everything and run the dependency-free rubric-automation tests.
      - run: python -m compileall -q lsh lsh-IRAC rubric-automation scripts run_experiment.py
      - run: pip install pytest
      - run: python -m pytest
