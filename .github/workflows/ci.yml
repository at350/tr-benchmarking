name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:dasha-comparison
      - run: npm run build

  python:
    name: Python ${{ matrix.python }} (compile, tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The embedding model (torch, sentence-transformers) is too heavy for CI, so the
      # package is installed without dependencies and the light ones are added by hand.
      # The clustering-bridge tests run with LSH_MOCK_EMBEDDINGS.
      - run: python -m compileall -q trbench rubric-automation scripts experiments
      - run: pip install -e . --no-deps
      - run: pip install pytest numpy scikit-learn umap-learn networkx python-louvain httpx python-dotenv openai tqdm
      - run: trbench --help
      - run: python -m pytest
